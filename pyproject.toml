[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kairo"
version = "0.4.0"
description = "Kairo — a multi-model, multi-provider coding agent with routing, orchestration, MCP bridging, sub-agent coordination, reflexion, and a self-improvement loop. Built for free local models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kairo Project" }]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "tenacity>=8.2",
    "rich>=13.7",
    "tiktoken>=0.7",
    "jsonschema>=4.21",
    "PyYAML>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.30"]
openai = ["openai>=1.30"]
ollama = ["ollama>=0.2"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
kairo = "kairo.cli:main"

[tool.setuptools.packages.find]
include = ["kairo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: marks tests that exercise multiple components together",
    "network: marks tests that require network access",
    "slow: marks tests that are slow",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "C4", "SIM", "RET"]
ignore = ["E501"]
